<svg width="500" height="100" viewBox="0 0 500 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente para Lemon - mismo verde exacto que el símbolo -->
    <linearGradient id="lemonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16A34A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16A34A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo (limón horizontal refinado) - altura óptica coincide con "L" -->
  <g transform="translate(10, 13) scale(0.38)">
    <!-- Forma de limón horizontal optimizada -->
    <path d="M 30 100 C 30 97.5, 31 95, 34 92 C 40 73, 68 42, 100 42 C 132 42, 160 73, 166 92 C 169 95, 170 97.5, 170 100 C 170 102.5, 169 105, 166 108 C 160 127, 132 158, 100 158 C 68 158, 40 127, 34 108 C 31 105, 30 102.5, 30 100 Z" fill="#16A34A" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Puntas laterales más definidas -->
    <ellipse cx="30" cy="100" rx="2.8" ry="2.2" fill="#16A34A"/>
    <ellipse cx="170" cy="100" rx="2.8" ry="2.2" fill="#16A34A"/>
    
    <!-- Líneas de ticket - grosor aumentado para visibilidad en tamaños pequeños -->
    <line x1="68" y1="86" x2="124" y2="86" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
    <line x1="68" y1="100" x2="108" y2="100" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
    <line x1="68" y1="114" x2="118" y2="114" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
    
    <!-- Micro curva refinada -->
    <path d="M 100 42 Q 101 100 100 158" stroke="#16A34A" stroke-width="0.5" opacity="0.15" fill="none"/>
  </g>
  
  <!-- Texto "Lemon POS" - espaciado reducido para mayor solidez -->
  <g>
    <!-- "Lemon" en gradiente verde (mismo hex #16A34A que símbolo), peso 700 -->
    <text x="82" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="42" font-weight="700" fill="url(#lemonGradient)">Lemon</text>
    
    <!-- "POS" en Gray 800 (#1F2937), peso 600, tracking +2 para respiración -->
    <text x="227" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="42" font-weight="600" fill="#1F2937" letter-spacing="2">POS</text>
  </g>
</svg>
