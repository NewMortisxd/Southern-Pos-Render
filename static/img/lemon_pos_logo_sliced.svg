<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definir gradientes para más realismo -->
  <defs>
    <radialGradient id="pulpGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F0FFF4;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#D4F4DD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BBF7D0;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="skinGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#16A34A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803D;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Círculo exterior (cáscara verde) con gradiente -->
  <circle cx="100" cy="100" r="60" fill="url(#skinGradient)" stroke="#15803D" stroke-width="2"/>
  
  <!-- Círculo interior (pulpa) con gradiente -->
  <circle cx="100" cy="100" r="50" fill="url(#pulpGradient)"/>
  
  <!-- Centro blanco -->
  <circle cx="100" cy="100" r="8" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Segmentos radiales (10 segmentos como una lima real) -->
  <g opacity="0.4">
    <line x1="100" y1="50" x2="100" y2="92" stroke="#BBF7D0" stroke-width="2"/>
    <line x1="100" y1="108" x2="100" y2="150" stroke="#BBF7D0" stroke-width="2"/>
    <line x1="50" y1="100" x2="92" y2="100" stroke="#BBF7D0" stroke-width="2"/>
    <line x1="108" y1="100" x2="150" y2="100" stroke="#BBF7D0" stroke-width="2"/>
    
    <!-- Diagonales -->
    <line x1="65" y1="65" x2="93" y2="93" stroke="#BBF7D0" stroke-width="1.8"/>
    <line x1="107" y1="107" x2="135" y2="135" stroke="#BBF7D0" stroke-width="1.8"/>
    <line x1="135" y1="65" x2="107" y2="93" stroke="#BBF7D0" stroke-width="1.8"/>
    <line x1="93" y1="107" x2="65" y2="135" stroke="#BBF7D0" stroke-width="1.8"/>
    
    <!-- Segmentos intermedios -->
    <line x1="75" y1="55" x2="95" y2="95" stroke="#BBF7D0" stroke-width="1.5"/>
    <line x1="125" y1="55" x2="105" y2="95" stroke="#BBF7D0" stroke-width="1.5"/>
    <line x1="145" y1="75" x2="105" y2="95" stroke="#BBF7D0" stroke-width="1.5"/>
    <line x1="145" y1="125" x2="105" y2="105" stroke="#BBF7D0" stroke-width="1.5"/>
    <line x1="125" y1="145" x2="105" y2="105" stroke="#BBF7D0" stroke-width="1.5"/>
    <line x1="75" y1="145" x2="95" y2="105" stroke="#BBF7D0" stroke-width="1.5"/>
    <line x1="55" y1="125" x2="95" y2="105" stroke="#BBF7D0" stroke-width="1.5"/>
    <line x1="55" y1="75" x2="95" y2="95" stroke="#BBF7D0" stroke-width="1.5"/>
  </g>
  
  <!-- Membranas entre segmentos (líneas más claras) -->
  <g opacity="0.25">
    <path d="M 100 50 Q 100 70 100 92" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
    <path d="M 100 108 Q 100 130 100 150" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
    <path d="M 50 100 Q 70 100 92 100" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
    <path d="M 108 100 Q 130 100 150 100" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Ticket integrado (más sutil) -->
  <rect x="65" y="88" width="70" height="24" fill="#FFFFFF" opacity="0.15" rx="2"/>
  
  <!-- Líneas de ticket -->
  <line x1="72" y1="95" x2="108" y2="95" stroke="#16A34A" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <line x1="72" y1="100" x2="98" y2="100" stroke="#16A34A" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <line x1="72" y1="105" x2="110" y2="105" stroke="#16A34A" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  
  <!-- Símbolo $ -->
  <text x="115" y="102" fill="#16A34A" font-family="Arial, sans-serif" font-size="11" font-weight="700" opacity="0.85">$</text>
  
  <!-- Textura de gotas de agua (opcional) -->
  <circle cx="85" cy="75" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="120" cy="80" r="1.2" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="110" cy="125" r="1.3" fill="#FFFFFF" opacity="0.55"/>
</svg>
