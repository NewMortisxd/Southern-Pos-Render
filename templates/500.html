<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Error del servidor | Lemon POS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .hero-gradient {
            background: linear-gradient(135deg, #f87171 0%, #ffffff 100%);
        }

        .error-number {
            font-size: 10rem;
            font-weight: 900;
            background: linear-gradient(135deg, #dc2626 0%, #f87171 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>

<body class="hero-gradient min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4">
        <div class="max-w-2xl mx-auto text-center">
            <div class="error-number mb-8">500</div>
            <h1 class="text-4xl md:text-5xl font-bold text-gray-800 mb-4">
                Error del servidor
            </h1>
            <p class="text-xl text-gray-600 mb-8">
                Algo salió mal en nuestro servidor. Estamos trabajando para solucionarlo.
            </p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                <a href="{% url 'dashboard' %}"
                    class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-full transition duration-300 transform hover:scale-105 shadow-lg">
                    <i class="fas fa-home mr-2"></i>Volver al inicio
                </a>
                <button onclick="location.reload()"
                    class="bg-white hover:bg-gray-100 text-red-600 font-bold py-3 px-8 rounded-full transition duration-300 transform hover:scale-105 shadow-lg border-2 border-red-600">
                    <i class="fas fa-redo mr-2"></i>Reintentar
                </button>
            </div>
            <div class="mt-12 text-gray-500">
                <i class="fas fa-exclamation-triangle text-4xl mb-4"></i>
                <p class="text-sm">Por favor, intenta nuevamente en unos momentos</p>
            </div>
        </div>
    </div>
</body>

</html>
